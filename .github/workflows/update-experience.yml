name: Update experience banner

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recompute years of experience
        run: python3 .github/scripts/update_experience.py

      - name: Refresh activity marker
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: auto-update experience banner"
            git push
          fi
